name: Build Android APK

# Builds an installable APK on every push to main (and on demand from the
# Actions tab), then publishes it as a GitHub Release you can open on your phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "plates-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          echo "APK_NAME=plates-${VERSION}-build${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: plates-apk
          path: ${{ env.APK_NAME }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Plates ${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            Install on Android: open this page on your phone, tap the .apk file below, then allow installing from your browser if asked.
            Built from ${{ github.sha }}.
          files: ${{ env.APK_NAME }}
          make_latest: true
